<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポップメモ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>ポップメモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1><span class="grad">ポップメモ</span> <span class="wiggle">✏️</span></h1>
    <div class="top-btns">
      <button class="icon-btn" id="btnTrash" aria-label="ゴミ箱">🗑️</button>
      <button class="icon-btn" id="btnSettings" aria-label="設定">⚙️</button>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input id="search" type="search" placeholder="メモを検索…" autocomplete="off">
  </div>

  <nav id="rows" class="rows" aria-label="五十音の行"></nav>

  <div id="listTitle" class="list-title"></div>
  <main id="list" class="list"></main>
  <div id="empty" class="empty" hidden></div>

  <button id="fab" class="fab" aria-label="新しいメモ">＋</button>
</div>

<!-- 編集画面 -->
<section id="editor" class="editor" hidden>
  <div class="ed-bar">
    <button class="pill-btn" id="edBack">← もどる</button>
    <div class="ed-actions">
      <button class="icon-btn" id="edPin" aria-label="ピン留め">📌</button>
      <button class="icon-btn" id="edDel" aria-label="削除">🗑️</button>
    </div>
  </div>
  <div class="ed-body">
    <input id="edTitle" class="ed-title" placeholder="タイトル" autocomplete="off">
    <div class="yomi-row">
      <input id="edYomi" class="ed-yomi" placeholder="読みがな（漢字・英字のとき入力）" autocomplete="off">
      <span id="edGyou" class="gyou-badge"></span>
    </div>
    <div id="colors" class="colors"></div>
    <textarea id="edText" class="ed-text" placeholder="ここにメモを書いてね"></textarea>
    <div id="checks" class="checks"></div>
    <div id="atts" class="atts"></div>
  </div>
  <div class="ed-tools">
    <button class="tool" id="tMic"><span>🎤</span>音声</button>
    <button class="tool" id="tImg"><span>📷</span>画像</button>
    <button class="tool" id="tPdf"><span>📎</span>PDF</button>
    <button class="tool" id="tCheck"><span>☑️</span>チェック</button>
  </div>
  <input type="file" id="fileImg" accept="image/*" multiple hidden>
  <input type="file" id="filePdf" accept="application/pdf" multiple hidden>
</section>

<!-- 設定シート -->
<div id="sheet" class="sheet-bg" hidden>
  <div class="sheet">
    <h2>設定 ⚙️</h2>
    <label class="row-item">並び替え
      <select id="selSort">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">五十音順</option>
      </select>
    </label>
    <label class="row-item">ダークモード
      <select id="selTheme">
        <option value="auto">自動</option>
        <option value="light">ライト</option>
        <option value="dark">ダーク</option>
      </select>
    </label>
    <div class="row-item col">
      <b>☁️ 自動バックアップ <span id="cloudBadge"></span></b>
      <small>ログインしておくと、メモを書くたびに自動でクラウドに保存されます。iPhoneが壊れても、ログインすれば元に戻ります。</small>
      <div id="cloudOff" class="cloud-form">
        <input id="cloudEmail" type="email" placeholder="メールアドレス" autocomplete="email" autocapitalize="off">
        <input id="cloudPw" type="password" placeholder="パスワード（8文字以上）" autocomplete="current-password">
        <div class="btn-line"><button class="pill-btn" id="btnLogin">ログイン</button><button class="pill-btn" id="btnSignup">はじめて（新規登録）</button></div>
      </div>
      <div id="cloudOn" hidden>
        <small id="cloudInfo"></small>
        <div class="btn-line"><button class="pill-btn" id="btnSyncNow">いますぐ同期</button><button class="pill-btn" id="btnLogout">OFFにする</button></div>
      </div>
    </div>
    <div class="row-item col">
      <b>手動バックアップ（おまけ）</b>
      <small>iPhoneは長期間でデータが消える場合があります。ときどき書き出してね。</small>
      <div class="btn-line">
        <button class="pill-btn" id="btnExport">書き出し</button>
        <button class="pill-btn" id="btnImport">読み込み</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
    <div class="row-item col"><small id="storageInfo">保存容量を確認中…</small></div>
    <button class="pill-btn big" id="sheetClose">とじる</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="viewer" class="viewer" hidden><button class="pill-btn" id="viewerClose">とじる ✕</button><img id="viewerImg" alt=""></div>

<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
